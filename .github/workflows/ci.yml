name: ci

# 门禁镜像：与 .harness/stack.json 的 L1/L3/L4 一致（test-only）。
# 本仓是 TypeSpec 契约仓，无 Docker 镜像 / VPS 部署 -- 旧版 ci.yml 是从
# lab-management-system-nextjs 错抄的 deploy 链，已删。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Checkout lab-nextjs sibling
        # tests/seeds-parity.test.ts 逐字节比对 ../lab-management-system-nextjs/src/seeds
        # （prod 灌库链 seed-from-snapshot.mjs 的消费副本 vs 本仓权威源 seeds/）。
        # 只用 node:fs 读 JSON，不 import sibling 模块，无需给 sibling 装依赖。
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-nextjs.git ../lab-management-system-nextjs
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com
      - name: L1 typespec compile
        run: npx --no tsp compile . --no-emit
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run
